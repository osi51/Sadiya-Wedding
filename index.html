<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sadiya with Akbar · Nikah Invitation</title>
    
    <!-- Open Graph Meta Tags for Link Sharing -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://osi51.github.io/Sadiya-Wedding/">
    <meta property="og:title" content="Sadiya with Akbar · Nikah Invitation">
    <meta property="og:description" content="Tap here to open your digital invitation card ✨">

    <!-- Fonts & Styling -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-stone-50 text-stone-800 min-h-screen flex flex-col items-center justify-center p-6">

    <!-- Hidden YouTube Audio Player for Background Music -->
    <div class="hidden">
        <iframe id="bgMusic" src="https://www.youtube.com/embed/GSHRIBcs_d8?autoplay=1&loop=1&playlist=GSHRIBcs_d8" allow="autoplay"></iframe>
    </div>

    <!-- Floating Music Toggle Button -->
    <button onclick="toggleAudio()" id="musicToggleBtn" class="fixed bottom-6 right-6 z-40 bg-amber-800 hover:bg-amber-900 text-white p-3.5 rounded-full shadow-lg flex items-center justify-center transition-all">
        🎵 <span id="musicText" class="text-xs ml-1.5 font-medium hidden sm:inline">Pause Music</span>
    </button>

    <!-- Main Invitation Card -->
    <div id="invite" class="max-w-xl w-full bg-white shadow-xl rounded-3xl p-8 my-8 border border-stone-100 text-center">
        <span class="text-amber-700 font-semibold tracking-widest text-xs uppercase">Nikah Celebration</span>
        
        <h1 class="text-4xl font-serif text-stone-900 mt-4 mb-3">
            Sadiya <span class="text-amber-700 text-2xl font-normal">with</span> Akbar
        </h1>
        
        <p class="text-sm italic text-stone-500 mb-6 max-w-md mx-auto">
            "And of His signs is that He created for you from yourselves mates that you may find tranquility in them..."
        </p>

        <div class="border-t border-b border-stone-100 py-6 my-6 space-y-2">
            <p class="text-stone-800 font-medium text-lg">Monday, 23 November 2026</p>
            <p class="text-amber-800 font-semibold text-sm">7:00 PM Onwards</p>
            <p class="text-stone-600 text-sm mt-2">Rockyard Garden, Prayagraj</p>
        </div>

        <p class="text-xs text-stone-400">We request the honor of your presence and blessings.</p>
    </div>

    <!-- Background Music Control Script -->
    <script>
        let isPlaying = true;
        function toggleAudio() {
            const iframe = document.getElementById('bgMusic');
            const musicText = document.getElementById('musicText');
            if (isPlaying) {
                iframe.src = "";
                musicText.innerText = "Play Music";
                isPlaying = false;
            } else {
                iframe.src = "https://www.youtube.com/embed/GSHRIBcs_d8?autoplay=1&loop=1&playlist=GSHRIBcs_d8";
                musicText.innerText = "Pause Music";
                isPlaying = true;
            }
        }
    </script>
</body>
</html>
